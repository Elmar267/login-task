<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body>
        <div class="bg-gray-50 px-4 md:px-8">
            <div class="min-h-screen flex flex-col items-center justify-center">
                <div class="max-w-md w-full">
                    <div
                        class="p-6 rounded-lg bg-white border border-slate-300 shadow-xs md:p-8">
                        <h1 class="text-slate-900 text-center text-3xl font-bold">Sign in</h1>

                        <form class="space-y-6 mt-10">
                        <div>
                            <label for="email"
                                class="mb-2 text-slate-900 font-medium text-sm inline-block">Email</label>
                            <input id="inputemail" type="email" name="email" placeholder="admin@gmail" required
                                class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600" />
                        </div>
                        <div>
                            <label for="password"
                                class="mb-2 text-slate-900 font-medium text-sm inline-block">Password</label>
                            <input id="inputPassword" type="password" name="password" placeholder="••••••••" required
                                class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600" />
                        </div>

                        <button type="button" onclick="signIn()"
                            class="w-full py-2 px-3.5 text-sm rounded-md font-semibold cursor-pointer tracking-wide text-white border border-blue-600 bg-blue-600 hover:bg-blue-700 transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                            Sign in
                        </button>

                        <div id="succes" class="bg-green-50 text-sm p-3 rounded-md hidden  flex-col gap-3 border border-green-100 sm:items-center sm:flex-row dark:bg-green-900/20 dark:border-green-800/40"
                            role="alert">
                            <p class="text-green-900 font-medium">Uğurlu nəticə!</p>
                            <p class="text-green-900 ">Xoş gəldiniz.</p>
                        </div>
                        <div id="errorone" class="bg-red-50 text-sm p-3 rounded-md hidden  gap-3 border border-red-100 flex-col sm:items-center sm:flex-row dark:bg-red-900/20 dark:border-red-800/40"
                            role="alert">
                            <p class="text-red-900 font-medium">Xəta!</p>
                            <p class="text-red-900 ">Düzgün giriş edin.</p>
                        </div>
                        <div id="errortwo" class="bg-red-50 text-sm p-3 rounded-md hidden  gap-3 border border-red-100 flex-col sm:items-center sm:flex-row dark:bg-red-900/20 dark:border-red-800/40"
                            role="alert">
                            <p class="text-red-900 font-medium ">Xəta!</p>
                            <p class="text-red-900 ">Məlumatlar əksik və ya yalnışdır.</p>
                        </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>

        <script src="app.js"></script>
    </body>
</html>
